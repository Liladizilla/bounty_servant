name: Bounty Servant Daily Radar

on:
  schedule:
    # 03:00 UTC = 06:00 East Africa Time (Africa/Nairobi, UTC+3)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Keep external bounty actions disabled"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: bounty-servant-daily
  cancel-in-progress: false

env:
  BOUNTY_SERVANT_DRY_RUN: "true"

jobs:
  discover:
    name: Discover, verify, and rank bounties
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Search and verify GitHub issues (dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bounty_servant.py
      - name: Send optional Telegram alert
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py
      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The report was not generated. Check the earlier step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist the bounty ledger
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json
          git diff --cached --quiet || git commit -m "Update bounty ledger [skip ci]"
          git push
      - name: Upload report artifact
        if: always() && hashFiles('reports/latest.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bounty-servant-report-${{ github.run_id }}
          path: |
            reports/latest.md
            reports/latest.json
            reports/bounties-*.md
          if-no-files-found: warn
          retention-days: 30
